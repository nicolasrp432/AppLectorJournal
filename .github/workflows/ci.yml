name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Lint es advisory por ahora: el baseline arrastra errores heredados
      # (ver docs/AUDITORIA.md P2). Se hará bloqueante al limpiar ese baseline.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm test -- --ci
